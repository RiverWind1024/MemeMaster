name: CI

on:
  push:
    branches: [master, release/*, feat/*]
    tags: ['v*']
  pull_request:
    branches: [master, release/*]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  flutter-version: '3.44.0'

jobs:
  # 临时精简：当前是 macOS Metal 推理崩溃的测试/修复任务，
  # 只保留 macos job 以加速 CI。修复完成后恢复其他平台 job。
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        run: |
          FLUTTER_VERSION=3.44.0
          if [ ! -d "$HOME/flutter" ]; then
            curl -sSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_${FLUTTER_VERSION}-stable.zip" -o /tmp/flutter.zip
            unzip -q /tmp/flutter.zip -d $HOME
            rm /tmp/flutter.zip
          fi
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Init third-party (clone deps)
        run: |
          echo "=== Running init-third-party.sh ==="
          ./scripts/init-third-party.sh 2>&1 | tee /tmp/init-output.txt
          INIT_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== init-third-party.sh exit code: $INIT_EXIT ==="
          if [ $INIT_EXIT -ne 0 ]; then
            echo "Script exited with error (see above)"
          fi
          echo ""
          echo "=== third_party contents ==="
          ls -la third_party/ 2>/dev/null || echo "third_party missing"
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp

      - name: Pin llama.cpp version
        run: |
          # 固定 llama.cpp 到已知可用的版本 (17a05e4)
          # 原因: llama.cpp master 分支 API 变更移除了 use_mmap，导致编译失败
          cd third_party/llama.cpp
          # 优先浅拉取指定 commit（快），失败再拉全量历史
          git fetch --depth 1 origin 17a05e451fd175d1d82a1ee96b266338f6b07005 2>/dev/null \
            || git fetch --unshallow 2>/dev/null || true
          git checkout 17a05e451fd175d1d82a1ee96b266338f6b07005
          echo "llama.cpp pinned to: $(git log --oneline -1)"

      - name: Build LLM (Metal)
        run: bash -x ./scripts/build-macos-llm.sh 2>&1
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp

      - name: Cache Metal test models
        uses: actions/cache@v4
        with:
          path: ~/.cache/mememaster-metal-test
          key: metal-models-qwen3.5-0.8b-v1

      - name: Run Metal inference smoke test
        run: bash -x ./scripts/test-macos-metal.sh 2>&1
        timeout-minutes: 45

      - name: Upload Metal smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-metal-smoke-test
          path: build/macos-metal-results
          retention-days: 14

      - name: Build macOS
        run: flutter build macos --release

      - name: Bundle native library into app
        run: |
          if [ ! -f "build/macos-llm/libmeme_llm.dylib" ]; then
            echo "WARNING: build/macos-llm/libmeme_llm.dylib not found, skipping bundle step"
            exit 0
          fi
          APP=$(find build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "WARNING: No .app bundle found in build/macos/Build/Products/Release, skipping bundle step"
            exit 0
          fi
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"
          cp build/macos-llm/libmeme_llm.dylib "$FRAMEWORKS/"
          echo "Copied libmeme_llm.dylib to $FRAMEWORKS"

      - name: Verify Metal library
        run: |
          LIB=$(find build/macos-llm -name "libmeme_llm.dylib" -type f 2>/dev/null | head -1)
          if [ -z "$LIB" ]; then
            LIB=$(find build/macos/Build/Products/Release -name "libmeme_llm.dylib" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$LIB" ]; then
            ls -lh "$LIB"
            if nm "$LIB" 2>/dev/null | grep -q ggml_metal; then
              echo "Metal symbols found"
            else
              echo "No Metal symbols found in $LIB"
            fi
          else
            echo "No libmeme_llm.dylib found"
          fi

      - name: Package macOS artifact
        run: |
          APP=$(find build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          zip -r mememaster-${{ env.VERSION }}-macos-arm64-metal.zip "$APP"
          ls -lh mememaster-${{ env.VERSION }}-macos-arm64-metal.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mememaster-${{ env.VERSION }}-macos-arm64-metal
          path: mememaster-${{ env.VERSION }}-macos-arm64-metal.zip
          retention-days: 7
